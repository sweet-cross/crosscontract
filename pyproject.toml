[project]
name = "crosscontract"
version = "0.7.0"
description = "Provides data contracts with frictionless schemas and client to interact with CROSS data platform.   "
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pandas>=2.3.3",
    "pandera[pandas]>=0.28.1",
    "pre-commit>=4.5.1",
    "pyarrow>=22.0.0",
    "pydantic[email]>=2.12.5",
    "ruff>=0.14.11",
    "sqlalchemy>=2.0.45",
]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "dotenv>=0.9.9",
    "jupyter>=1.1.1",
    "mypy>=1.19.1",
    "notebook>=7.5.1",
    "pandas-stubs>=2.3.3.251219",
    "polyfactory>=3.2.0",
    "pytest>=9.0.2",
    "respx>=0.22.0",
    "types-pyyaml>=6.0.12.20250915",
]
docs = [
    "mkdocs-jupyter>=0.25.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "pymdown-extensions>=10.20",
    "mkdocs-macros-plugin>=1.5.0",
]


#-------- Build System Configuration --------#
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosscontract"]


#-------- Versioning Configuration --------#
[tool.semantic_release]
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/crosscontract/__init__.py:__version__"]
commit_message = "{version}\n\n[skip ci]"
branch = "main"

#-------- Ruff Configuration --------#
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff]
exclude = ["notebooks", "backend/alembic"]


#-------- Pytest Configuration --------#
[tool.pytest.ini_options]
addopts = "-W ignore::DeprecationWarning --tb=no --log-level=WARNING"
testpaths = ["src/tests"]
pythonpath = "src"


#-------- Coverage Configuration --------#
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
omit = [
    # exclude test folders
    "src/tests/*",
]
exclude_lines = [
    "pragma: no cover",
    "pass  # pragma: no cover",
    "^\\s*pass\\s*$",            # Standalone pass statements
    "^\\s*\\.\\.\\.\\s*$",       # Standalone ellipsis
    "raise NotImplementedError", # Abstract method implementations
]

#-------- Mypy Configuration --------#
[tool.mypy]
exclude = ["src/tests/"]
#disable_error_code = ["misc"]
