# Standalone manual workflow to publish the package to PyPI.
# Defaults to the latest GitHub release tag.
#
# This is intentionally NOT a reusable (`workflow_call`) workflow: routine
# releases publish inline from release_main_branch.yml. Calling this file via
# `uses:` would split GitHub's OIDC token into mismatched refs and break PyPI
# Trusted Publishing attestations (see the note in release_main_branch.yml).
#
# Running this manually requires its own Trusted Publisher on PyPI configured
# for `publish_pypi.yml` (the routine path uses `release_main_branch.yml`).
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.2.1). Defaults to latest release."
        required: false
        type: string
        default: ""

jobs:
  resolve_version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Get latest release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
            echo "tag=$LATEST" >> $GITHUB_OUTPUT
          fi
      - name: Validate tag exists
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ${{ inputs.version }} --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Error: version '${{ inputs.version }}' not found in releases"
            exit 1
          fi

  publish:
    needs: resolve_version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crosscontract
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_version.outputs.tag }}
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Inspect wheel contents
        run: unzip -l dist/*.whl
      - uses: pypa/gh-action-pypi-publish@release/v1
