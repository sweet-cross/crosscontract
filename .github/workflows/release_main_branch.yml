# Orchestrator workflow that runs on every push to main. main is the public
# release branch — when dev fast-forwards into it, the latest PSR-created tag
# is at HEAD, and we publish that tag to PyPI and deploy the docs at it.
# The publish job is gated by the `pypi` GitHub Environment, which requires
# manual approval before the upload happens.
name: Release Main Branch

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    test_and_coverage:
        uses: ./.github/workflows/test_and_coverage.yml

    publish:
        needs: test_and_coverage
        if: success()
        uses: ./.github/workflows/publish_pypi.yml
        permissions:
            contents: read
            id-token: write
        secrets: inherit

    deploy_docs:
        needs: publish
        if: success()
        uses: ./.github/workflows/deploy_docs.yml
