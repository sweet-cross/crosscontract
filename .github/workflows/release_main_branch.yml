# Orchestrator workflow for the main branch.
# 1. Runs tests on every push, PR to main, or manual trigger.
# 2. Deploys docs ONLY if tests pass AND the event is NOT a pull request.
name: Release Main Branch

on:
    workflow_dispatch:
    pull_request:
        branches:
        - main
    push:
        branches:
        - main

jobs:
    test_and_coverage:
        uses: ./.github/workflows/test_and_coverage.yml

    release:
        needs: test_and_coverage
        if: success() && github.event_name != 'pull_request'
        uses: ./.github/workflows/versioning.yml
        permissions:
            contents: write

    deploy_docs:
        needs: release
        if: >-
            always() && needs.test_and_coverage.result == 'success' &&
            (needs.release.outputs.released == 'true' || (github.event_name == 'push' && needs.release.result == 'success'))
        uses: ./.github/workflows/deploy_docs.yml
        with:
            ref: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.tag || github.ref }}
